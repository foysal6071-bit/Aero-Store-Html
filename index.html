<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aero Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f8;--surface:#fff;--ink:#0f1222;--mute:#6a6f85;--line:#e4e6ef;--brand:#4b3df2;--on-brand:#fff;
box-sizing:border-box;padding-top:var(--sat,env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d17;--surface:#141828;--ink:#eef0fa;--mute:#9aa1ba;--line:#232844;--brand:#7b6dff;--on-brand:#0b0d17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d17;--surface:#141828;--ink:#eef0fa;--mute:#9aa1ba;--line:#232844;--brand:#7b6dff;--on-brand:#0b0d17;color-scheme:dark}
:root[data-theme="green"]{--bg:#07140e;--surface:#0e2017;--ink:#e8f6ee;--mute:#8fb5a0;--line:#1b3a2a;--brand:#2fc77a;--on-brand:#04130b;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans','Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:24px 16px calc(112px + env(safe-area-inset-bottom,0px))}
.kicker{color:var(--mute);font-weight:600;font-size:14px}
h1{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.search{display:flex;align-items:center;gap:10px;margin:18px 0 22px;padding:0 16px;height:48px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.search svg{flex:none;width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;outline:0;min-width:0}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
:is(button,a):focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0 0 12px}
.feat{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 28px;padding:0 16px;scrollbar-width:none}
.feat::-webkit-scrollbar{display:none}
.fc{flex:0 0 84%;max-width:340px;scroll-snap-align:start;border-radius:28px;padding:20px;color:#fff;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;cursor:pointer}
.fc small{opacity:.85;font-weight:600}
.fh{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.fc .fh h3{flex:1;min-width:0;font-size:23px}
.fc .ico{width:60px;height:60px;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.28),0 0 0 1.5px rgba(255,255,255,.6)}
.fc h3{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.fc p{opacity:.9;font-size:14px}
.fc{position:relative;overflow:hidden}
.fc.hs{min-height:216px;padding-right:118px}
.fc.hs.land{padding-right:20px;padding-top:96px}
.fc.hs .fh{flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:0}
.fc.hs .fh h3{flex:none;font-size:20px}
.fc.hs .ico{width:48px;height:48px;font-size:22px}
.fshots{position:absolute;right:16px;top:18px;display:flex;gap:8px;pointer-events:none}
.fs{width:84px;aspect-ratio:9/19.5;border-radius:12px;overflow:hidden;position:relative;border:1.5px solid rgba(255,255,255,.55);background:rgba(0,0,0,.25);box-shadow:0 8px 18px rgba(0,0,0,.35)}
.fshots.land{top:16px;right:16px}
.fshots.land .fs{width:150px;aspect-ratio:1600/720;border-radius:10px}
.fs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 8px;padding:0 16px 4px;scrollbar-width:none}
.pill{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:12px}
.row{min-width:0}
.row{--rb:#fff;display:flex;gap:14px;align-items:center;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--rb);box-shadow:0 1px 3px rgba(15,18,34,.08);cursor:pointer}
.ico{flex:none;border-radius:22%;display:grid;place-items:center;color:#fff;font-weight:800;position:relative;overflow:hidden}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.row .ico{width:56px;height:56px;font-size:24px}
.info{flex:1;min-width:0}
.info b{display:block;font-weight:700}
.info span{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.get{display:inline-block;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:14px;padding:8px 20px;border-radius:999px;text-decoration:none;white-space:nowrap}
.empty{padding:32px 0;color:var(--mute);text-align:center}
footer{margin-top:28px;color:var(--mute);font-size:13px;text-align:center}
footer a{color:var(--brand);font-weight:600;text-decoration:none}

/* ===== Play Store style detail page ===== */
.page{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateX(100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.page.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.page,.page.open{transition:none}}
.pbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--sat,env(safe-area-inset-top,0px))) 8px 8px;background:var(--bg);border-bottom:1px solid transparent}
.pbar.stuck{border-bottom-color:var(--line)}
.back{position:relative;overflow:hidden;display:grid;place-items:center;flex:none;width:42px;height:42px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(15,18,34,.1);-webkit-tap-highlight-color:transparent;transition:scale .3s cubic-bezier(.3,1.6,.5,1),background .2s}
.back svg{position:relative;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:translate .3s cubic-bezier(.3,1.6,.5,1)}
.back:active{scale:.84}
.back:active svg{translate:-3px 0}
.back::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;opacity:0;scale:.2;pointer-events:none}
.back.tap::after{animation:backRipple .55s ease-out}
@keyframes backRipple{0%{opacity:.24;scale:.2}100%{opacity:0;scale:1.25}}
.get{transition:scale .25s cubic-bezier(.3,1.6,.5,1)}
.get:active{scale:.93}
[tabindex="-1"]:focus{outline:none}
/* tab switch transition */
#view{will-change:transform,opacity}
#view.tout{animation:viewOut .16s ease-in both}
#view.tin{animation:viewIn .4s cubic-bezier(.2,.9,.25,1) both}
@keyframes viewOut{to{opacity:0;transform:translateX(var(--dx,-24px)) scale(.98)}}
@keyframes viewIn{from{opacity:0;transform:translateX(var(--dx,24px)) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#view.tout,#view.tin{animation:none}}
/* page content entrance */
.page.open .pin>*{animation:pinIn .55s cubic-bezier(.2,.8,.2,1) both}
.page.open .pin>:nth-child(1){animation-delay:.08s}
.page.open .pin>:nth-child(2){animation-delay:.14s}
.page.open .pin>:nth-child(3){animation-delay:.2s}
.page.open .pin>:nth-child(4){animation-delay:.26s}
.page.open .pin>:nth-child(5){animation-delay:.32s}
.page.open .head .ico{animation:icoPop .65s cubic-bezier(.3,1.6,.5,1) .1s both}
@keyframes pinIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes icoPop{from{opacity:0;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page.open .pin>*,.page.open .head .ico,.back.tap::after{animation:none}}
.ptitle{font-weight:800;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar.stuck .ptitle{opacity:1}
.pin{max-width:680px;margin:0 auto;padding:4px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.head{display:flex;gap:16px;align-items:center}
.head .ico{width:88px;height:88px;font-size:38px}
.head h3{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.head .dev{color:var(--brand);font-weight:700;font-size:14px;margin-top:2px}
.head .kicker{font-size:13px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);margin:20px 0 16px}
.meta div{padding:4px;text-align:center}
.meta div+div{border-left:1px solid var(--line)}
.meta b{display:block;font-weight:800}
.meta span{font-size:12px;color:var(--mute)}
.install{margin-top:20px;display:block;text-align:center;width:100%;padding:13px;font-size:16px;border-radius:999px}
.shots{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;margin:22px -16px 6px;padding:0 16px;scrollbar-width:none}
.shots::-webkit-scrollbar{display:none}
.shot{flex:none;height:300px;aspect-ratio:9/19.5;border-radius:16px;border:1px solid var(--line);padding:0;overflow:hidden;cursor:pointer;scroll-snap-align:start;color:#fff;font-weight:800;font-size:15px;line-height:1.2;display:grid;place-items:center;text-align:center;position:relative}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sec{margin-top:26px}
.sec h4{font-size:18px;font-weight:800;margin-bottom:8px;letter-spacing:-.01em}
.sec p{color:var(--mute);white-space:pre-line}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{border:0;background:none;color:var(--brand);font:inherit;font-weight:700;padding:8px 0 0;cursor:pointer}
.tag{display:inline-block;margin-top:12px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink)}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 0}
.kv div+div{border-top:1px solid var(--line)}
.kv span{color:var(--mute)}
.kv b{font-weight:700}
.note{font-size:13px;margin-top:12px;color:var(--mute)}

.lb{position:fixed;inset:0;z-index:30;background:rgba(5,6,15,.92);display:none;align-items:center;justify-content:center;gap:6px;padding:16px}
.lb.open{display:flex}
.lbimg{width:min(calc(100vw - 112px),300px,calc(80vh*9/19));aspect-ratio:9/19;border-radius:24px;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;text-align:center;position:relative}
.lbimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lbn,.lbx{border:0;background:rgba(255,255,255,.16);color:#fff;width:44px;height:44px;border-radius:50%;font-size:24px;cursor:pointer;flex:none}
.lbx{position:absolute;top:calc(16px + var(--sat,env(safe-area-inset-top,0px)));right:16px}
/* ===== scroll reveal animation ===== */
.rv{opacity:0;transform:translateY(56px) scale(.5);transform-origin:50% 60%}
.rv.in{opacity:1;transform:none;transition:opacity .5s ease,transform .65s cubic-bezier(.2,1.1,.3,1);transition-delay:var(--d,0ms)}
html,body{overflow-x:hidden}
.page{overflow-x:hidden}
/* ===== menu, drawer, tutorial ===== */
.menu{display:grid;place-items:center;width:44px;height:44px;margin:0 0 14px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0}
.menu svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.scrim{position:fixed;inset:0;z-index:24;background:rgba(5,6,15,.55);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.scrim.open{opacity:1;visibility:visible;transition:opacity .25s}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:25;width:min(300px,84vw);background:var(--surface);border-right:1px solid var(--line);padding:calc(20px + var(--sat,env(safe-area-inset-top,0px))) 16px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;transform:translateX(-100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.drawer.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.drawer,.drawer.open,.scrim,.scrim.open{transition:none}}
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.dhead h2{margin:0}
.dclose{border:0;background:transparent;color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}
.dclose:active{background:var(--line)}
.dlabel{color:var(--mute);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}
.dbtn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-align:left;margin-bottom:24px}
.dbtn svg{flex:none;width:20px;height:20px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th[aria-pressed="true"]{border-color:var(--brand)}
.tl{display:flex;flex-direction:column;align-items:center;margin-top:18px}
.ts{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 16px 20px}
.ts .top{display:flex;gap:12px;align-items:center}
.ts .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800}
.ts h4{font-size:19px;font-weight:800;letter-spacing:-.01em}
.ts p{color:var(--mute);font-size:14px;margin:10px 0 16px}
.ph{display:block;width:min(100%,250px);height:auto;margin:0 auto;border-radius:22px;border:5px solid #101015;box-shadow:0 0 0 1px var(--line),0 12px 28px rgba(0,0,0,.22)}
.arr{display:grid;place-items:center;width:42px;height:42px;margin:10px 0;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.arr svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tutt{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:8px}

.th{display:flex;flex-direction:column;align-items:stretch;gap:9px;padding:8px;border-radius:18px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.th[aria-pressed="true"]{box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.tp{display:block;width:100%;aspect-ratio:16/10;border-radius:11px;background:var(--pbg);border:1px solid var(--pln);padding:8px;overflow:hidden}
.tp .pa{display:block;width:38%;height:6px;border-radius:3px;background:var(--pbr);margin-bottom:7px}
.tp .pr{display:block;height:12px;border-radius:6px;background:var(--psf);border:1px solid var(--pln);margin-top:5px}
.tn{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 2px 1px;font-weight:700;font-size:13px}
.tck{flex:none;width:18px;height:18px;color:var(--brand);opacity:0;scale:.5;transition:opacity .2s,scale .3s cubic-bezier(.3,1.5,.5,1)}
.th[aria-pressed="true"] .tck{opacity:1;scale:1}
.tck path{fill:none;stroke:var(--on-brand);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dfoot{margin-top:auto;padding-top:20px}
.dcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);min-width:0}
.dav{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-weight:800;font-size:22px}
.dtx{min-width:0;display:flex;flex-direction:column;gap:1px}
.dtx small{color:var(--mute);font-size:12px;font-weight:600}
.dtx b{color:var(--ink);font-size:18px;font-weight:800;letter-spacing:-.01em}
.dtx a{color:var(--brand);font-size:13px;font-weight:600;text-decoration:none;word-break:break-all}
:root[data-theme="glass"] .dcard{background:var(--glass);border-color:var(--gline);-webkit-backdrop-filter:blur(18px) saturate(165%);backdrop-filter:blur(18px) saturate(165%)}
/* ===== glass theme ===== */
:root[data-theme="glass"]{--bg:#090a18;--surface:rgba(255,255,255,.08);--ink:#f3f4ff;--mute:#a9aecb;--line:rgba(255,255,255,.14);--brand:#9a8cff;--on-brand:#0b0d17;--glass:rgba(255,255,255,.09);--gline:rgba(255,255,255,.2);--b1:#7c5cff;--b2:#ff5fa8;--gsh:0 10px 30px rgba(0,0,0,.4);
--blobs:radial-gradient(62% 40% at 10% 0%,color-mix(in srgb,var(--b1) 60%,transparent),transparent 72%),radial-gradient(50% 36% at 100% 32%,color-mix(in srgb,var(--b2) 48%,transparent),transparent 72%),radial-gradient(62% 42% at 0% 100%,color-mix(in srgb,var(--b1) 45%,transparent),transparent 72%);color-scheme:dark}
:root[data-theme="glass"] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--blobs)}
:root[data-theme="glass"] .page{background:var(--blobs),var(--bg)}
:root[data-theme="glass"] :is(.search,.list,.menu,.th,.dbtn,.ts,.kv,.arr){background:var(--glass);border-color:var(--gline);-webkit-backdrop-filter:blur(18px) saturate(165%);backdrop-filter:blur(18px) saturate(165%);box-shadow:var(--gsh),inset 0 1px 0 var(--gline)}
:root[data-theme="glass"] .search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 30%,transparent)}
:root[data-theme="glass"] .th[aria-pressed="true"]{border-color:var(--brand)}
:root[data-theme="glass"] .row+.row{border-top-color:var(--gline)}
:root[data-theme="glass"] .drawer{background:var(--glass);border-right-color:var(--gline);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%)}
:root[data-theme="glass"] .pbar{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(165%);backdrop-filter:blur(18px) saturate(165%)}
:root[data-theme="glass"] .pbar.stuck{border-bottom-color:var(--gline)}
:root[data-theme="glass"] .scrim{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
:root[data-theme="glass"] .fc{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.28);box-shadow:var(--gsh),inset 0 1px 0 rgba(255,255,255,.4)}
:root[data-theme="glass"] .fc::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.32),rgba(255,255,255,0) 48%)}
:root[data-theme="glass"] .ico{box-shadow:0 6px 16px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.25)}
:root[data-theme="glass"] .get{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 70%,#fff));box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.45)}
:root[data-theme="glass"] .fc .get{background:rgba(255,255,255,.92);box-shadow:0 4px 12px rgba(0,0,0,.18)}
:root[data-theme="glass"] .ts .n{box-shadow:0 4px 12px color-mix(in srgb,var(--brand) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}
.themes{grid-template-columns:repeat(2,1fr)}
/* category tabs: Apps / Games */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .row{--rb:rgba(255,255,255,.85);box-shadow:none}}
:root:is([data-theme="dark"],[data-theme="green"],[data-theme="glass"]) .row{--rb:rgba(255,255,255,.85);box-shadow:none}
:root[data-theme="glass"] .list{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-theme="glass"] .row{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(165%);backdrop-filter:blur(18px) saturate(165%);box-shadow:var(--gsh)}
.feat[hidden],h2[hidden]{display:none}

.row{--rb:var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .row{--rb:var(--line)}}
:root:is([data-theme="dark"],[data-theme="green"],[data-theme="glass"]) .row{--rb:var(--line)}
/* featured cards: readable text + visible button */
.fc::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.45),rgba(0,0,0,.08) 62%,rgba(0,0,0,0))}
.fc>:not(.fshots){position:relative;z-index:1}
.fshots{z-index:1}
.fc h3,.fc p,.fc small{text-shadow:0 1px 3px rgba(0,0,0,.35)}
.fc .get{background:#fff;color:#0f1222;box-shadow:0 4px 12px rgba(0,0,0,.22);text-shadow:none}
.fc .get.cx{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px #fff}
/* softer one-time reveal */
.rv{opacity:0;transform:translateY(48px) scale(.55) rotate(var(--r,0deg));transform-origin:50% 75%;will-change:transform,opacity}
.rv.in{opacity:1;transform:none;transition:opacity .25s ease,transform .45s cubic-bezier(.2,1.15,.3,1);transition-delay:var(--d,0ms)}
.row.rv.in .ico{animation:icoPop .4s cubic-bezier(.3,1.6,.5,1) calc(var(--d,0ms) + 60ms) both}
@media (prefers-reduced-motion:reduce){.rv,.rv.in{opacity:1;transform:none;transition:none}.row.rv.in .ico{animation:none}}
/* category chips */
.pills[hidden]{display:none}
.pills{margin:16px -16px 18px}
body[data-tab="search"] .pills{margin-top:-8px}
.pill{transition:background .2s,color .2s,border-color .2s}
/* detail page stats */
.meta{grid-template-columns:repeat(2,1fr)}
.meta b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Auto theme button */
.th[data-t="auto"]{grid-column:1/-1;flex-direction:row;align-items:center}
.th[data-t="auto"] .tp{flex:none;width:64px}
.th[data-t="auto"] .tn{flex:1}

/* no blue tap box on tabs/buttons */
*{-webkit-tap-highlight-color:transparent}
.tab,.tabs,button,a{-webkit-touch-callout:none;outline:none}
.tab:focus,.tab:active{outline:none;background-color:transparent}
.tab:focus-visible{outline:none}

/* disable text selection / copy / callout */
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

  long:"A calculator that keeps a private vault.\n\nVeilcalc looks and works like a normal calculator. Type your secret PIN, press = and your private vault opens.\n\nFeatures:\n• Real calculator with history and 4 themes: Dark, Light, Green and Night Glass\n• Secret PIN (4 to 10 digits): enter it on the calculator and press =\n• Private vault for photos, videos and files\n• Select several items and move them to the recycle bin together\n• Recycle bin with photo previews, restore or delete for good\n• Auto-lock after inactivity, and the vault locks when you leave the app\n• Extra protection after repeated wrong PINs\n• Everything stays on your device",

let tab='Apps',q='',sa=0,ss=0,pageOpen=false,cf='';
const $=s=>document.querySelector(s);
let kb=false;addEventListener('keydown',()=>kb=true,true);addEventListener('pointerdown',()=>kb=false,true);
const fx=(el,fb)=>{const t=kb?el:fb;if(t)t.focus({preventScroll:true})};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inTab=a=>tab==='Search'||tab==='All'||(tab==='Games'?a.cat==='Games':a.cat!=='Games');
const TABS=['Search','Apps','Games'];
const grad=a=>`linear-gradient(145deg,${a.c[0]},${a.c[1]})`;
const icon=a=>`<div class="ico" style="background:${grad(a)}" aria-hidden="true">${esc(a.name[0])}${a.icon?`<img src="${esc(a.icon)}" alt="" onerror="this.remove()">`:''}</div>`;

function hasShots(a){return !a.noshots&&a.shots&&a.shots.length>0}
function fshots(a){if(!hasShots(a))return '';return `<div class="fshots${a.land?' land':''}">${a.shots.slice(0,1).map(u=>`<div class="fs"><img src="${esc(u)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></div>`).join('')}</div>`}
function drawPills(){
 const el=$('#pills'),cats=[...new Set(APPS.filter(a=>inTab(a)).map(a=>a.cat))];
 if(cats.length<2){el.hidden=true;el.innerHTML='';return}
 el.hidden=false;
 el.innerHTML=['',...cats].map(c=>`<button class="pill" data-c="${esc(c)}" aria-pressed="${c===cf}">${c?esc(c):'All'}</button>`).join('');
}
function drawFeat(){setTimeout(watch);const fl=APPS.map((a,i)=>a.feat&&tab!=='Search'&&!cf&&inTab(a)?`<div class="fc${hasShots(a)?' hs':''}${hasShots(a)&&a.land?' land':''}" data-i="${i}" style="background:${grad(a)}">${fshots(a)}<div class="fh">${ringIcon(a)}<h3>${esc(a.name)}</h3></div><p class="dst" data-k="${esc(a.apk)}"></p><p>${esc(a.desc)}</p><div class="gw"><a class="get" data-k="${esc(a.apk)}" href="${esc(a.apk)}" target="_blank" rel="noopener">Download</a></div></div>`:'');$('#feat').innerHTML=fl.join('');const has=fl.some(Boolean);$('#feat').hidden=!has;$('#ftitle').hidden=!has;paintAll()}
function drawList(){
 const f=APPS.map((a,i)=>({a,i})).filter(({a})=>inTab(a)&&(!cf||a.cat===cf)&&(a.name+a.desc).toLowerCase().includes(q));
 $('#list').innerHTML=f.length?f.map(({a,i})=>`<div class="row" data-i="${i}">${ringIcon(a)}<div class="info"><b>${esc(a.name)}</b><span class="dst" data-k="${esc(a.apk)}"></span><span>${esc(a.desc)}</span><span>${esc(a.cat)} · ${esc(a.size)}</span></div><div class="gw"><a class="get" data-k="${esc(a.apk)}" href="${esc(a.apk)}" target="_blank" rel="noopener">Download</a></div></div>`).join(''):`<p class="empty">No ${(tab==='Search'||tab==='All')?'results':tab.toLowerCase()} found. Try a different search.</p>`;
 paintAll();setTimeout(watch);
}

/* screenshots */
const shotsOf=a=>a.shots&&a.shots.length?a.shots:[0,1,2,3];
const shotBg=(a,n)=>grad({c:n%2?a.c:[a.c[1],a.c[0]]});
function shotsHtml(a,i){if(a.noshots)return '';return `<div class="shots" aria-label="Screenshots">${shotsOf(a).map((u,n)=>`<button class="shot${a.land?' land':''}" data-i="${i}" data-s="${n}" aria-label="Preview ${n+1}" style="background:${shotBg(a,n)}">${typeof u==='string'?`<img src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()">`:`<span>${esc(a.name)}<br>Preview ${n+1}</span>`}</button>`).join('')}</div>`}
function showShot(i,n){sa=i;ss=n;const a=APPS[i],u=shotsOf(a)[n];const el=$('#lbimg');el.classList.toggle('land',!!a.land);el.style.background=shotBg(a,n);el.innerHTML=typeof u==='string'?`<img src="${esc(u)}" alt="" onerror="this.remove()">`:`<span>${esc(a.name)}<br>Preview ${n+1}</span>`;$('#lb').classList.add('open')}
function stepShot(d){const L=shotsOf(APPS[sa]).length;showShot(sa,(ss+d+L)%L)}
const closeLb=()=>$('#lb').classList.remove('open');

/* detail page */
const infoHtml=a=>`${a.log?`<div class="sec"><h4>What’s new</h4><p>${esc(a.log)}</p></div>`:''}<div class="sec"><h4>App info</h4><div class="kv"><div><span>Size</span><b>${esc(a.size)}</b></div><div><span>Category</span><b>${esc(a.cat)}</b></div><div><span>Developer</span><b>Foysal</b></div></div></div>`;
function openPage(i,push=true){
 const a=APPS[i],about=a.long||a.desc;
 $('#ptitle').textContent=a.name;
 $('#pin').innerHTML=`<div class="head">${ringIcon(a)}<div><h3>${esc(a.name)}</h3><span class="kicker">${esc(a.tag||a.cat)}</span><span class="dst" data-k="${esc(a.apk)}"></span></div></div>
 <div class="meta"><div><b>${esc(a.size)}</b><span>Size</span></div><div><b>${esc(a.cat)}</b><span>Category</span></div></div>
 <div class="gw gwp"><button type="button" class="un" data-k="${esc(a.apk)}" hidden>Uninstall</button><a class="get install" data-k="${esc(a.apk)}" href="${esc(a.apk)}" target="_blank" rel="noopener">Download</a></div>
 ${shotsHtml(a,i)}
 <div class="sec"><h4>About this app</h4><p id="about" class="clamp">${esc(about)}</p><button class="more" id="more" hidden>Read more</button></div>
 ${infoHtml(a)}`;
 const pg=$('#page');pg.scrollTop=0;pg.classList.add('open');pg.setAttribute('aria-hidden','false');$('#pbar').classList.remove('stuck');
 document.body.style.overflow='hidden';
 const ab=$('#about'),mb=$('#more');
 if(ab.scrollHeight>ab.clientHeight+2)mb.hidden=false;
 if(push&&!pageOpen)history.pushState({app:i},'');
 pageOpen=true;pg.tabIndex=-1;fx($('#back'),pg);paintAll();
}
function closePage(){
 if(!pageOpen)return;
 pageOpen=false;const pg=$('#page');pg.classList.remove('open');pg.setAttribute('aria-hidden','true');document.body.style.overflow='';
}
function goBack(){if(pageOpen&&history.state&&history.state.app!==undefined)history.back();else closePage()}

let swapId=0;
function setTab(t){
 if(t===tab)return;
 const dir=TABS.indexOf(t)>TABS.indexOf(tab)?1:-1;
 tab=t;glassTo(TABS.indexOf(t),true);
 document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
 const view=$('#view'),id=++swapId;
 const apply=()=>{
  const sr=t==='Search',al=t==='All',w=t.toLowerCase();
  document.body.dataset.tab=w;
  $('#htitle').textContent=sr?'Search':'Aero Store';
  $('#ltitle').textContent=sr?'Apps & games':al?'All apps & games':'All '+w;
  const ph=(sr||al)?'Search apps & games':'Search '+w;$('#q').placeholder=ph;$('#q').setAttribute('aria-label',ph);
  document.querySelectorAll('#feat .fc,#list .row').forEach(e=>e.classList.remove('rv','in'));
  cf='';$('#feat').scrollLeft=0;window.scrollTo(0,0);drawPills();drawFeat();drawList();
 };
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){apply();return}
 view.classList.remove('tin');view.style.setProperty('--dx',(dir*-26)+'px');
 void view.offsetWidth;view.classList.add('tout');
 setTimeout(()=>{
  if(id!==swapId)return;
  apply();
  view.classList.remove('tout');view.style.setProperty('--dx',(dir*40)+'px');
  void view.offsetWidth;view.classList.add('tin');
 },150);
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{setTab(b.dataset.tab);if(b.dataset.tab==='Search')setTimeout(()=>$('#q').focus({preventScroll:true}),230)}));
/* liquid glass toggle: slide, squash and swipe */
const tabsEl=$('.tabs'),gl=$('.tglass');let tp=1,skipClick=false;
function glassTo(p,anim){tp=p;tabsEl.style.setProperty('--p',p);if(anim){gl.classList.remove('squash');void gl.offsetWidth;gl.classList.add('squash')}}
glassTo(1,false);
gl.addEventListener('animationend',()=>gl.classList.remove('squash'));

/* ===== download ring: talks to the Android wrapper (AeroBridge) ===== */
let DL={};const pend={},cxl={},RS={};
/* installed-app detection: APPS[].pkg = Android package name */
const PK={};APPS.forEach(a=>{if(a.pkg)PK[a.apk]=a.pkg});
let INST=new Set();
/* updates: catalog version (APPS[].ver) vs the version installed on the phone */
const CV={};APPS.forEach(a=>{if(a.pkg)CV[a.apk]=a.ver||''});
let VER={};const UPD={};
const vnum=v=>(String(v||'').match(/\d+/g)||[]).map(Number);
function vcmp(a,b){a=vnum(a);b=vnum(b);for(let i=0;i<Math.max(a.length,b.length);i++){const x=a[i]||0,y=b[i]||0;if(x!==y)return x>y?1:-1}return 0}
const verKey=k=>'aeroVer:'+PK[k];
function markVer(k){try{if(CV[k]&&localStorage.getItem(verKey(k))!==CV[k])localStorage.setItem(verKey(k),CV[k])}catch(e){}}
function needsUpd(k){const p=PK[k],iv=VER[p];if(!p||!INST.has(p)||!iv||!CV[k])return false;
 try{if(localStorage.getItem(verKey(k))===CV[k])return false}catch(e){}
 return vcmp(CV[k],iv)>0}
const LI={}; /* installs started here: the button says Installing right away, even before the app reports it */
const hasBridge=()=>!!window.AeroBridge;
const RING_SVG='<svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="rt" cx="50" cy="50" r="46.5"/><g transform="rotate(-90 50 50)"><circle class="rp" cx="50" cy="50" r="46.5" pathLength="100"/></g></svg><svg class="ckb" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="24"/><path d="M39 51l8 8 15-17" pathLength="100"/></svg>';
const ringIcon=a=>`<span class="dlw" data-k="${esc(a.apk)}" data-s="idle">${icon(a)}${RING_SVG}</span>`;
const mbs=b=>{const m=b/1048576;return m>=10?String(Math.round(m)):String(+m.toFixed(1))};
function dinfo(k){
 const o=DL[k];
 if(o&&o.status==='installing')return{s:'inst',pct:100,t:'Installing\u2026'};
 if(o&&o.status==='installed'){markVer(k);return{s:'insok',pct:100,t:'Installed'}}
 const L=LI[k];
 if(L&&(!o||o.status==='done')){
  const now=Date.now(),pk=PK[k];
  if(L.ok){markVer(k);if(now-L.ok<2500)return{s:'insok',pct:100,t:'Installed'};delete LI[k]}
  else if(!L.had&&pk&&INST.has(pk)){markVer(k);L.ok=now;setTimeout(paintAll,2600);return{s:'insok',pct:100,t:'Installed'}}
  else if(now-L.t<(L.had?25000:45000))return{s:'inst',pct:100,t:'Installing\u2026'};
  else delete LI[k];
 }
 if(PK[k]&&INST.has(PK[k])){
  if(needsUpd(k)){if(!o||(o.status==='done'&&!UPD[k]))return{s:'upd',pct:100,t:''}}
  else if(!o||o.status==='done'||o.status==='failed')return{s:'open',pct:100,t:''};
 }
 if(!o)return{s:'idle'};
 if(o.status==='done')return{s:'done',pct:100,t:''};
 if(o.status==='failed')return{s:'fail',pct:100,t:'Download failed'};
 if(o.status==='paused')return{s:'spin',pct:0,t:'Waiting for network…'};
 if(!(o.total>0&&o.got>0))return{s:'spin',pct:0,t:'Starting…'};
 return{s:'run',pct:o.pct,t:o.pct+'% · '+mbs(o.got)+' of '+mbs(o.total)+' MB'};
}
function paintRing(w,d){

 }

const BTN={idle:'Download',run:'Cancel',spin:'Cancel',done:'Install',fail:'Retry',open:'Open',upd:'Update',inst:'Installing\u2026',insok:'Installed'};

function paintTxt(t,d){

function paintAll(){

 let silent=false;try{silent=typeof AeroBridge.isSilent==='function'&&AeroBridge.isSilent()}catch(e){}
 if(silent)for(const k in n){const p=DL[k];if(p&&(p.status==='running'||p.status==='paused')&&n[k].status==='done'&&!LI[k])LI[k]={t:now,had:!!(PK[k]&&INST.has(PK[k]))}}

}

 const ord={act:0,fail:1,done:2};
 items.sort((p,q)=>ord[dlGroup(p.o)]-ord[dlGroup(q.o)]);

/* which of the store's apps are installed on this phone -> button shows Open */
function refreshInstalled(){
 if(!hasBridge()||typeof AeroBridge.installed!=='function')return;
 try{
  const l=JSON.parse(AeroBridge.installed(JSON.stringify(Object.values(PK))));
  const n=new Set(l);
  let vs={};try{if(typeof AeroBridge.versions==='function')vs=JSON.parse(AeroBridge.versions(JSON.stringify(Object.values(PK))))}catch(e){}
  const vch=JSON.stringify(vs)!==JSON.stringify(VER);VER=vs;
  if(!vch&&n.size===INST.size&&l.every(x=>INST.has(x)))return;
  /* an app was uninstalled: forget its old downloaded APK and update marker, so the next tap downloads the latest version */
  for(const k in PK){const pk=PK[k];if(INST.has(pk)&&!n.has(pk)){
   try{localStorage.removeItem(verKey(k))}catch(e){}delete UPD[k];
   if(DL[k]&&DL[k].status==='done'&&!LI[k]){try{AeroBridge.cancel(k)}catch(e){}delete DL[k];cxl[k]=Date.now()}
  }}
  INST=n;dlSync();paintAll();
 }catch(e){}
}

 $('#imPair').addEventListener('click',()=>{try{AeroBridge.pairWireless()}catch(e){}});
 $('#imShizAct').addEventListener('click',()=>{try{AeroBridge.shizukuAction()}catch(e){}});
 const flip=id=>$(id).getAttribute('aria-checked')!=='true';
 $('#optTcp').addEventListener('click',()=>{const on=flip('#optTcp');$('#optTcp').setAttribute('aria-checked',String(on));try{AeroBridge.setTcpMode(on)}catch(e){}setTimeout(paintOpts,200)});
 $('#optLeg').addEventListener('click',()=>{const on=flip('#optLeg');$('#optLeg').setAttribute('aria-checked',String(on));try{AeroBridge.setLegacyPairing(on)}catch(e){}setTimeout(paintOpts,200)});
 $('#optPort').addEventListener('click',()=>{try{AeroBridge.editTcpPort()}catch(e){}});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)markIm()});
 markIm();
}
</script>
<script>
(function(){var sp=document.getElementById('splash');if(!sp)return;var t0=Date.now(),done=0;
function hide(){if(done)return;done=1;setTimeout(function(){sp.classList.add('out');setTimeout(function(){sp.remove()},600)},Math.max(0,500-(Date.now()-t0)))}
if(document.readyState==='complete')hide();else addEventListener('load',hide);setTimeout(hide,6000)})();
</script>
<script>
["copy","cut","contextmenu","selectstart","dragstart"].forEach(function(e){document.addEventListener(e,function(ev){var t=ev.target;if(t&&t.closest&&t.closest("input,textarea"))return;ev.preventDefault()},true)});
</script>
</body>
